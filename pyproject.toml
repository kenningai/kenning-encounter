[project]
name = "kenning-encounter"
version = "0.12.1"
description = "An encounter-sequential substrate for a trajectory's own accumulated experience, over Neo4j — integrated temporal causality, authored coherence, and provenance that survives revision"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [
    { name = "Conor O'Shea, Kenning AI LLC", email = "contact@kenningai.com" },
]
keywords = ["mcp", "neo4j", "llm", "agent", "trajectory", "memory", "knowledge-graph", "provenance", "temporal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "fastmcp>=3.0,<4",
    "neo4j>=5.26.0",
    "pydantic>=2.10.1",
    "starlette>=0.28.0",
]

[project.urls]
Homepage = "https://github.com/kenningai/kenning-encounter"
Repository = "https://github.com/kenningai/kenning-encounter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright>=1.1.389",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.3",
    "testcontainers[neo4j]>=4.10.0",
]

[project.scripts]
kenning-encounter = "kenning_encounter:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/kenning_encounter"]
