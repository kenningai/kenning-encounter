[project]
name = "mcp-agent-memory"
version = "0.2.1"
description = "Structured, persistent working memory for LLM agents over Neo4j — accumulate, recall, and reason across sessions, with tool-enforced integrity"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [
    { name = "Conor O'Shea, Kenning AI", email = "contact@kenningai.com" },
]
keywords = ["mcp", "neo4j", "llm", "agent", "memory", "knowledge-graph", "recall"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "fastmcp>=3.0,<4",
    "neo4j>=5.26.0",
    "pydantic>=2.10.1",
    "starlette>=0.28.0",
]

[project.urls]
Homepage = "https://github.com/kenningai/mcp-agent-memory"
Repository = "https://github.com/kenningai/mcp-agent-memory"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright>=1.1.389",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.3",
    "testcontainers[neo4j]>=4.10.0",
    "aiohttp>=3.8.0",
]

[project.scripts]
mcp-agent-memory = "mcp_agent_memory:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_agent_memory"]
