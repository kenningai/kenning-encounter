name: kenning_encounter

# A single semantic-experience unit: Neo4j (the substrate) + Kenning Encounter MCP server
# (the writer/reader). Kenning Encounter talks to Neo4j over the internal Docker network
# (bolt://neo4j:7687, service-name DNS); the published 7474/7687 ports are for
# external access (Neo4j Browser, external Bolt clients) and are NOT needed for
# Kenning Encounter -> Neo4j path.
#
# Requires NEO4J_KENNING_ENCOUNTER_PASSWORD in the environment or a .env file (see .env.example).

services:
  neo4j:
    image: neo4j:2026.04.0          # Community Edition (no -enterprise suffix); latest calendar release
    container_name: kenning_encounter-neo4j
    ports:
      - "7474:7474"                 # HTTP / Neo4j Browser
      - "7687:7687"                 # Bolt
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_KENNING_ENCOUNTER_PASSWORD}"

      # Plugins are auto-downloaded version-matched to the Neo4j image. Under
      # calendar versioning APOC and GDS ship in lockstep (e.g. apoc 2026.05.0
      # for neo4j 2026.05.0), so this never strands a mismatched jar. Both run on
      # Community; Kenning Encounter needs apoc (apoc.meta.schema) and graph-data-science
      # (gds.* — pagerank/betweenness/louvain/wcc/projections). The image also
      # auto-sets dbms.security.procedures.unrestricted for these — do NOT set it
      # manually, it conflicts with the plugin auto-config.
      NEO4J_PLUGINS: '["apoc","graph-data-science"]'
      # To add the extended APOC procedures, use the line below instead. It is a
      # separate labs jar; if a brand-new Neo4j release ships before its
      # apoc-extended build, startup will fail on the download — pin back if so.
      # NEO4J_PLUGINS: '["apoc","apoc-extended","graph-data-science"]'

      # Community has exactly ONE user database — you cannot CREATE DATABASE kenning-encounter.
      # Name the single default database 'kenning-encounter' so Kenning Encounter's NEO4J_DATABASE=kenning-encounter
      # resolves instead of erroring "database does not exist".
      NEO4J_initial_dbms_default__database: "kenning-encounter"

      # Reasonable single-agent memory. The Kenning Encounter graph is small; GDS projections
      # live in heap. Tune later with `neo4j-admin server memory-recommendation`.
      NEO4J_server_memory_pagecache_size: "1G"
      NEO4J_server_memory_heap_initial__size: "1G"
      NEO4J_server_memory_heap_max__size: "2G"

      # Listen on all interfaces so the published ports work. For REMOTE Browser
      # access (a client not on this host), also set the advertised addresses to
      # this host's reachable address, e.g.:
      #   NEO4J_server_bolt_advertised__address: "your.host:7687"
      #   NEO4J_server_http_advertised__address: "your.host:7474"
      NEO4J_server_default__listen__address: "0.0.0.0"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      # /plugins is intentionally NOT a named volume: NEO4J_PLUGINS re-fetches
      # version-matched jars on each start, so a Neo4j version bump can never
      # leave a stale plugin behind. (Costs a few seconds + internet at boot.)
    healthcheck:
      # Gate readiness on actually answering a query, not just the port opening —
      # otherwise Kenning Encounter races Neo4j, fails verify_connectivity(), and exit(1)s
      # into a restart loop. Generous start_period covers first-boot plugin fetch.
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p '${NEO4J_KENNING_ENCOUNTER_PASSWORD}' 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 60s
    restart: unless-stopped

  kenning_encounter:
    build: .
    image: kenning-encounter:0.12.0
    container_name: kenning_encounter-mcp
    depends_on:
      neo4j:
        condition: service_healthy   # wait until Neo4j answers queries, not just opens the port
    ports:
      - "8003:8000"                  # streamable-http MCP surface
    environment:
      NEO4J_URI: "bolt://neo4j:7687" # internal Docker DNS — no published port needed for this hop
      NEO4J_USERNAME: "neo4j"
      NEO4J_PASSWORD: "${NEO4J_KENNING_ENCOUNTER_PASSWORD}"
      NEO4J_DATABASE: "kenning-encounter"
      NEO4J_TRANSPORT: "http"
      NEO4J_MCP_SERVER_HOST: "0.0.0.0"
      NEO4J_MCP_SERVER_PORT: "8000"
      NEO4J_MCP_SERVER_PATH: "/api/mcp/"
      NEO4J_MCP_SERVER_ALLOWED_HOSTS: "*"
      # Opt-in: no MCP sessions, so a restart leaves nothing stale for a
      # client or bridge to hold. Every locus-scoped call must then pass
      # session_id. Default off.
      NEO4J_MCP_SERVER_STATELESS: "${NEO4J_MCP_SERVER_STATELESS:-false}"
      # Infusion governors — PINNED EXPLICITLY, not left to code defaults.
      # Both values are pre-registered experimental variables cited in the
      # published protocol, so the running value must be attestable from the
      # deployment file rather than inferred from source. These match the
      # go-forward decision of 2026-07-29 (frontier bias unchanged at 0.3).
      NEO4J_INFUSE_FRONTIER_BIAS: "0.3"
      # Hand-set until measurement places it at the knee of the attenuation
      # curve. Do not tune by feel — that is the whole point.
      NEO4J_INFUSE_REFRESH_TURNS: "10"
      # The meaning matcher (v0.9.0) — infuse's seed source
      # (measured in at T0: recall 7/8 vs the 2/8 lexical baseline,
      # trajectory +2). GEMINI_API_KEY rides in from .env (compose
      # auto-loads it); no key -> infuse falls back to the lexical
      # Extract->Match path and reports it. The sidecar of compressed node
      # meanings is built on the host by scripts/build_meaning_sidecar.py
      # (incremental; rerun after write-heavy sessions) and rides in
      # through the read-only ./models mount; the server reloads it on
      # mtime change, so a host-side rebuild reaches the container without
      # a restart. Sidecar only — never node properties; nothing written
      # to Neo4j. Timeout 5000ms is deliberate and measured: the
      # arc-dependent cases that justify the mechanism take ~3.5s of
      # reasoning, and a cap that cuts the tail kills exactly the calls
      # buying the most.
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      NEO4J_MATCHER_MODEL: "${NEO4J_MATCHER_MODEL:-gemini-3.5-flash-lite}"
      NEO4J_MATCHER_TIMEOUT_MS: "${NEO4J_MATCHER_TIMEOUT_MS:-5000}"
      # Selections per call (max 12 = the seed limit). Output tokens are the
      # dominant cost of a warm call, so this is the latency lever.
      NEO4J_MATCHER_TOP_N: "${NEO4J_MATCHER_TOP_N:-12}"
      NEO4J_MATCHER_SIDECAR: "/app/models/meaning_sidecar.json"
    volumes:
      # The meaning sidecar lives INSIDE the stack, like neo4j_data — a
      # named volume, not a host file, so nothing on the host (cleanup
      # jobs, path conventions, curious hands) can touch it and the whole
      # Kenning Encounter is one `docker compose up`. It is a derived, self-healing
      # cache: the server meaning-makes new nodes into it on write and a
      # startup reconcile sweep rebuilds any gap — up to the entire file —
      # from the graph. Inspect with:
      #   docker exec kenning_encounter-mcp cat /app/models/meaning_sidecar.json
      - sidecar_data:/app/models
      # HTTP sessions are always stateful (v0.3.0) — no knob. The session IS
      # the locus: encounters depend on the states that preceded them, so the
      # mcp-session-id carries the locus identity and close_encounter /
      # create_entities implicitly address the encounter THIS session opened.
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  sidecar_data:
