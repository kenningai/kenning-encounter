name: kenning_encounter

# A single semantic-experience unit: Neo4j (the substrate), Kenning Encounter MCP server
# (the trajectory's own face, read and write) and the reader face (read-only,
# for every other harness). Both faces talk to Neo4j over the internal Docker
# network (bolt://neo4j:7687, service-name DNS).
#
# EVERY PUBLISHED PORT IS BOUND TO 127.0.0.1. The host is the custodian and
# the gatekeeper: nothing off this machine can read the trajectory, and
# nothing can write it except through the full face. A fabricated past is
# indistinguishable from a lived one at re-entry, so integrity cannot be
# checked afterwards; it has to be kept. Someone else who wants to know
# something about the trajectory asks it, through whoever keeps the host.
# Do not widen a binding to 0.0.0.0 to reach this from another machine.
#
# Requires NEO4J_KENNING_ENCOUNTER_PASSWORD in the environment or a .env file (see .env.example).

services:
  neo4j:
    image: neo4j:2026.04.0          # Community Edition (no -enterprise suffix); latest calendar release
    container_name: kenning_encounter-neo4j
    ports:
      # Bolt bypasses both faces (no allowlist, no guarded writer), so it is
      # the one binding that matters most. Host-only, for Neo4j Browser and
      # cypher-shell on this machine. The host ports are overridable because
      # a host-only binding cannot share a port with another local Neo4j
      # (Neo4j Desktop, say), where a 0.0.0.0 binding silently could: then
      # localhost reached the OTHER database and only the network reached
      # this one.
      - "127.0.0.1:${NEO4J_KENNING_ENCOUNTER_HTTP_PORT:-7474}:7474"   # HTTP / Neo4j Browser
      - "127.0.0.1:${NEO4J_KENNING_ENCOUNTER_BOLT_PORT:-7687}:7687"   # Bolt
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_KENNING_ENCOUNTER_PASSWORD}"

      # Plugins are auto-downloaded version-matched to the Neo4j image. Under
      # calendar versioning APOC and GDS ship in lockstep (e.g. apoc 2026.05.0
      # for neo4j 2026.05.0), so this never strands a mismatched jar. Both run on
      # Community; Kenning Encounter needs apoc (apoc.meta.schema) and graph-data-science
      # (gds.* — pagerank/betweenness/louvain/wcc/projections). The image also
      # auto-sets dbms.security.procedures.unrestricted for these — do NOT set it
      # manually, it conflicts with the plugin auto-config.
      NEO4J_PLUGINS: '["apoc","graph-data-science"]'
      # To add the extended APOC procedures, use the line below instead. It is a
      # separate labs jar; if a brand-new Neo4j release ships before its
      # apoc-extended build, startup will fail on the download — pin back if so.
      # NEO4J_PLUGINS: '["apoc","apoc-extended","graph-data-science"]'

      # Community has exactly ONE user database — you cannot CREATE DATABASE kenning-encounter.
      # Name the single default database 'kenning-encounter' so Kenning Encounter's NEO4J_DATABASE=kenning-encounter
      # resolves instead of erroring "database does not exist".
      NEO4J_initial_dbms_default__database: "kenning-encounter"

      # Reasonable single-agent memory. The Kenning Encounter graph is small; GDS projections
      # live in heap. Tune later with `neo4j-admin server memory-recommendation`.
      NEO4J_server_memory_pagecache_size: "1G"
      NEO4J_server_memory_heap_initial__size: "1G"
      NEO4J_server_memory_heap_max__size: "2G"

      # Listen on all of the CONTAINER's interfaces so Docker's port publishing
      # can reach it; what the host exposes is set by the bindings above.
      NEO4J_server_default__listen__address: "0.0.0.0"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      # /plugins is intentionally NOT a named volume: NEO4J_PLUGINS re-fetches
      # version-matched jars on each start, so a Neo4j version bump can never
      # leave a stale plugin behind. (Costs a few seconds + internet at boot.)
    healthcheck:
      # Gate readiness on actually answering a query, not just the port opening —
      # otherwise Kenning Encounter races Neo4j, fails verify_connectivity(), and exit(1)s
      # into a restart loop. Generous start_period covers first-boot plugin fetch.
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p '${NEO4J_KENNING_ENCOUNTER_PASSWORD}' 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 60s
    restart: unless-stopped

  kenning_encounter:
    build: .
    image: kenning-encounter:0.13.0
    container_name: kenning_encounter-mcp
    depends_on:
      neo4j:
        condition: service_healthy   # wait until Neo4j answers queries, not just opens the port
    ports:
      - "127.0.0.1:8003:8000"        # the full face: the trajectory's own harness only
    environment:
      NEO4J_URI: "bolt://neo4j:7687" # internal Docker DNS — no published port needed for this hop
      NEO4J_USERNAME: "neo4j"
      NEO4J_PASSWORD: "${NEO4J_KENNING_ENCOUNTER_PASSWORD}"
      NEO4J_DATABASE: "kenning-encounter"
      NEO4J_TRANSPORT: "http"
      NEO4J_MCP_SERVER_HOST: "0.0.0.0"
      NEO4J_MCP_SERVER_PORT: "8000"
      NEO4J_MCP_SERVER_PATH: "/api/mcp/"
      # Host-header check: refuses a request that reached the port by DNS
      # rebinding (a web page in a browser on this host, posing as local).
      NEO4J_MCP_SERVER_ALLOWED_HOSTS: "localhost,127.0.0.1"
      # Opt-in: no MCP sessions, so a restart leaves nothing stale for a
      # client or bridge to hold. Every locus-scoped call must then pass
      # session_id. Default off.
      NEO4J_MCP_SERVER_STATELESS: "${NEO4J_MCP_SERVER_STATELESS:-false}"
      # Infusion governors — PINNED EXPLICITLY, not left to code defaults.
      # Both values are pre-registered experimental variables cited in the
      # published protocol, so the running value must be attestable from the
      # deployment file rather than inferred from source. These match the
      # go-forward decision of 2026-07-29 (frontier bias unchanged at 0.3).
      NEO4J_INFUSE_FRONTIER_BIAS: "0.3"
      # Hand-set until measurement places it at the knee of the attenuation
      # curve. Do not tune by feel — that is the whole point.
      NEO4J_INFUSE_REFRESH_TURNS: "10"
      # The meaning matcher — infuse's seed source (measured in at T0:
      # recall 7/8 vs the 2/8 lexical baseline, trajectory +2). Keys ride
      # in from .env (compose auto-loads it); with no key at all, infuse
      # falls back to the lexical Extract->Match path and says so.
      #
      # VOICES (v0.17.0). A voice is one model that both compresses the
      # node meanings and matches against them, and each keeps its own
      # sidecar, stamped by the voice that wrote it and refused by any
      # other. GEMINI_API_KEY enables the Gemini voice, OPENAI_API_KEY the
      # OpenAI one. NEO4J_MATCHER_LEAD picks which leads (gemini | openai |
      # alternate — the last chosen per locus from the session id); the
      # other is the fallback, in the same 5000 ms budget. A voice that
      # fails is tried after the healthy one for NEO4J_MATCHER_COOLDOWN_S.
      # Which voice should lead is not settled: it has not been measured.
      #
      # Timeout 5000 ms is deliberate and measured: the arc-dependent cases
      # that justify the mechanism take ~3.5 s of reasoning, and a cap that
      # cuts the tail kills exactly the calls buying the most.
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      NEO4J_MATCHER_MODEL: "${NEO4J_MATCHER_MODEL:-gemini-3.5-flash-lite}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      NEO4J_MATCHER_OPENAI_MODEL: "${NEO4J_MATCHER_OPENAI_MODEL:-gpt-6-luna}"
      NEO4J_MATCHER_LEAD: "${NEO4J_MATCHER_LEAD:-gemini}"
      NEO4J_MATCHER_COOLDOWN_S: "${NEO4J_MATCHER_COOLDOWN_S:-300}"
      NEO4J_MATCHER_TIMEOUT_MS: "${NEO4J_MATCHER_TIMEOUT_MS:-5000}"
      # Selections per call (max 12 = the seed limit). Output tokens are the
      # dominant cost of a warm call, so this is the latency lever.
      NEO4J_MATCHER_TOP_N: "${NEO4J_MATCHER_TOP_N:-12}"
      # Base name; each voice's sidecar sits beside it as
      # meaning_sidecar.<provider>-<model>.json.
      NEO4J_MATCHER_SIDECAR: "/app/models/meaning_sidecar.json"
      # Shadow matching: the non-delivering voice also matches every
      # prompt, after the payload is built, and the pair is logged to
      # /app/models/matcher-shadow.jsonl — never delivered. It costs a
      # second provider call per prompt (at OpenAI, cached prefix tokens
      # count against the per-minute limit in full). Read it with
      # scripts/matcher_voices_report.py.
      NEO4J_MATCHER_SHADOW: "${NEO4J_MATCHER_SHADOW:-false}"
    volumes:
      # The meaning sidecars live INSIDE the stack, like neo4j_data — a
      # named volume, not a host file, so nothing on the host (cleanup
      # jobs, path conventions, curious hands) can touch them and the whole
      # Kenning Encounter is one `docker compose up`. Each is a derived, self-healing
      # cache: the server meaning-makes new nodes into every configured
      # voice's sidecar on write, and a startup reconcile sweep rebuilds any
      # gap — up to the entire file — from the graph. Inspect with:
      #   docker exec kenning_encounter-mcp ls /app/models
      - sidecar_data:/app/models
    restart: unless-stopped

  # The READER face (v0.19.0; the v0.18 author profile, renamed): the face
  # every harness but the trajectory's own connects to (a desktop client,
  # another vendor's model, a test author). Same image and graph as `kenning_encounter`,
  # but an allowlist of read tools only, enforced in the server whatever the
  # client exposes: no writes, no matcher, and nothing added later unless
  # allowed. Nothing is withheld by default; an experiment whose author must
  # not see its own record sets NEO4J_READER_HIDE_LOCI. No matcher keys and
  # NO sidecar volume, so no voice's meanings are reachable from here.
  # Direct reading is for the keeper's own work; anyone else asks.
  kenning_encounter-reader:
    build: .
    image: kenning-encounter:0.13.0
    container_name: kenning_encounter-reader
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "127.0.0.1:8005:8000"        # the reader face; 8003 is the full face
    environment:
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USERNAME: "neo4j"
      NEO4J_PASSWORD: "${NEO4J_KENNING_ENCOUNTER_PASSWORD}"
      NEO4J_DATABASE: "kenning-encounter"
      NEO4J_TRANSPORT: "http"
      NEO4J_MCP_SERVER_HOST: "0.0.0.0"
      NEO4J_MCP_SERVER_PORT: "8000"
      NEO4J_MCP_SERVER_PATH: "/api/mcp/"
      NEO4J_MCP_SERVER_ALLOWED_HOSTS: "localhost,127.0.0.1"
      NEO4J_MCP_SERVER_STATELESS: "true"
      NEO4J_MCP_SERVER_PROFILE: "reader"
      NEO4J_READER_HIDE_LOCI: "${NEO4J_READER_HIDE_LOCI:-}"
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  sidecar_data:
